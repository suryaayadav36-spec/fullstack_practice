<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height:100px;
            width:100px;
        }
        .linear-gradient{
            background: linear-gradient(to right, burlywood, brown);
        }
        .radial-gradient{
            background: radial-gradient(circle, pink, lightblue);
        }
        .conic-gradient{
            background: conic-gradient(red,green, blue, yellow,green);
        }
    </style>
</head>
<body>
    <div class="box linear-gradient"></div>
    <div class="box radial-gradient"></div>
    <div class="box conic-gradient"></div>
</body>
</html>
</body>
</html>
