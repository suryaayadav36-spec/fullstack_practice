<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div::after{
            content: "gla";
        }
        p::before{
            content: "vrindavan";
        }
        /* First-letter/first-line are applicable for block-level elements */
        span::first-letter{
            text-transform: uppercase;
    }
    section::first-letter{
        font-weight: bold;
        color: blueviolet;
    }
    article::first-line{
        font-family:monospace;
        color:greenyellow;
        }
        </style>
</head>
<body>
    <!-- Pseudo-elements are used to style specific parts of an element -->
    <div>I am from </div>
    <p>Mathura</p>
    <section>hello</section>
    <article>i love to travel around the world</article>
</body>
</html>
