<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .box{
        height:100px;
        width:100px;
        background-color:pink;
        animation-name: tilt;
        animation-duration:3s;
        animation-delay: 0.5s;
        animation-iteration-count: infinite;
    }
    @keyframes tilt{
        0%{

        }
        80%{
            transform: skew(-90deg);
        }
    }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
