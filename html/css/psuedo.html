<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            background-color: blueviolet;
            height:100px;
            width:100px;
        }
        div:hover{
            background-color: greenyellow;
        }
        div:active{
            background-color: red;
        }
        input:focus{
            background-color: blue;
        }
        input:active{
            background-color: green;
        }
        </style>
</head>
<body>
    <!--psuedo classes targets elements state during interaction .It is represented by a colon (:) -->
    <div></div>
    <input>
</body>
</html>
