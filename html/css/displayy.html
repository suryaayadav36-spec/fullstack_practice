<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--justify-content: it aligns the child elements horizontally-->
    <!--align-items: it aligns the child elements verticallly-->
    <!--flex-direction: column and align items swap their way of working(mechanism)-->
    <!--the axis flips justify content and align items swap their way of working(mechanism)-->
    <!--space-around: child have rqual spacing between them-->
    <!--space-evenly: child have equal spacing between them and their surroundings-->
    <div style="display:flex; 
    flex-direction:column;
    justify-content: space-evenly;
    align-items:center;
    height:100vh;
    ">
        <div>C1</div>
        <div>C2</div>
        <div>C3</div>
        <div>C4</div>
    </div>
</body>
</html>
