<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Fixed units - these units are fixed in nature and do not change with respect to any regards -->
     <!-- relative units - these units are relative to the size of the element or the viewport -->
      <div style="width: 100px; height: 100px;position: absolute; background-color: limegreen;z-index: 1;left:50px;top:50px;"></div>
      <div style="width: 100px; height: 100px; position: absolute; background-color: blue;z-index: 2;"></div>
      <div style="height:100px; width:100px; position: absolute; background-color: brown;left:100px;top:100px;"></div>
</body>
</html>
