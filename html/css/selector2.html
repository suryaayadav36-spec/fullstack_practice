<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Descendant selector can be at any nested level */
        .grandparent > p{
            background-color: blueviolet;
        }
        </style>
</head>
<body>
    <!--Grandparent-->
    <div class="grandparent">
            <p>Child</p>
            <!--Parent-->
            <div class="parent">
                <p>Grandchild</p>
            </div>
    </div>
</body>
</html>
