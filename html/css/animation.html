<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            height: 100px;
            width: 100px;
            background-color: limegreen;
            /* animation: name duration delay iteration  */
            /* duration - the total time taken to complete the whole animation cycle */
            /* delay - the time taken for the animation to wait for it to start */
        animation: tilt 1s 0.001s  infinite;
        }

         @keyframes tilt{
           0% {

           }
           50% {
            transform: skew(40deg);
           }
           100% {
            transform: skew(-40deg);
           }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
