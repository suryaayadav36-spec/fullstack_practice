<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <style></style>
    <title>Form</title>
</head>
<body>
    <header><h1>Signup Form</h1></header>
    <div class="divClass">Wall1</div>
    <div class="divClass">Wall2</div>
    <div class="divClass">Wall3</div>
    <div id="divId" style="color:greenyellow">Wall4</div>
    <main>
       <section>
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your Name"  required>
        <br>
        <br>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email id" pattern=""[A-Za-z0-9] required>
        <br>
        <br>
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
        <br>
        <br>
        <label for="phone number">Phone number</label>
        <input type="number" id="phone" placeholder="Enter your Phone no" maxlength="10" required>
        <br>
        <br>
        <label for="father'sname">Father's Name</label>
        <input type="text" id="father-name" placeholder="Enter you Father Name" required>
        <br>
        <br>
        <label for="mother'sname">Mother's Name</label>
        <input type="text" id="mother-name" placeholder="Enter you Mother Name" required>
        <br>
        <br>
        <label for="roll number">Roll number</label>
        <input type="number" id="roll-number" placeholder="Enter your Roll no" required>
        <br>
        <br>
        <label for="Address">Address</label>
        <input type="text" id="address" placeholder="Enter your Address" required>
        <br>
        <br>
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" placeholder="Enter your DOB" required>
        <br>
        <br>
        <select id="bg">
            <option value="choose your blood group"></option>
            <option value="B+">B+</option>
            <option value="O+">O+</option>
            <option value="AB+">AB+</option>
        </select>
        <br>
        <br>
        <label for="gender">Gender</label>
        <input type="radio" id="gender" name="gender" value="male">M
        <input type="radio" id="gender" name="gender" value="female">F
       </section> 
       <!-- fieldset & legend are used to group forms-->
       <fieldset>
        <legend>Academic info</legend>
        <label for="degree">Degree</label>
        <input type="text">
       </fieldset>
       <label for="feedback">Feedback</label>
       <textarea name="location" rows="5" cols="10"></textarea>
       <button type="submit">Submit</button>
    </main>
    
</body>
</html>
